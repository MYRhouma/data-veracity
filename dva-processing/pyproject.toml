[project]
name = "dva-processing"
version = "0.1.0"
description = "Data Veracity Assurance Python Modules"
readme = "README.md"
authors = [{ name = "FTSRG", email = "bpeter@edu.bme.hu" }]
license = "Apache-2.0"
requires-python = ">=3.10"
dependencies = [
	"fastapi~=0.136.3",
	"great-expectations>=1.3.3",
	"jsonpath-ng>=1.7.0",
	"jsonschema>=4.23.0",
	"jq>=1.10.0",
	"numpy==1.26.4",
	"pandas>=2.1.1",
	"plac>=1.4.5",
	"psycopg[binary]>=3.2.9",
	"pydantic>=2.10.6",
	"requests>=2.32.3",
	"structlog>=25.1.0",
	"uvicorn>=0.34.3",
	"validators>=0.35.0",
	"pydantic-yaml>=1.6.0",
]
classifiers = ["Private :: Do Not Upload"]

[project.scripts]
dva-processing = "dva_processing.main:cli"

[project.optional-dependencies]
logging = ["rich>=13.9.4"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dva_processing"]

[dependency-groups]
dev = ["pytest>=8.3.5", "ruff>=0.16.7"]

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
# Conservative starting set: pyflakes (F), the pycodestyle checks ruff enables
# by default (E4 imports, E7 statements, E9 syntax), and isort (I) so import
# blocks are ordered and grouped mechanically rather than by hand.
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.isort]
known-first-party = ["dva_processing"]
